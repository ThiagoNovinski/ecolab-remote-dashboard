services:
  db:
    image: postgres:15-alpine
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  web:
    build: .
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - db

  ngrok:
    image: ngrok/ngrok:latest
    restart: always
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command:
      - "http"
      - "web:5000" # Aponta direto para o container web na rede interna
      - "--domain=say-drizzle-credit.ngrok-free.dev"
    depends_on:
      - web
    ports:
      - "4040:4040" # Expõe o painel de monitoramento do Ngrok para você

volumes:
  postgres_data: