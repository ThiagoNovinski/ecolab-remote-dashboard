<!DOCTYPE html>
<html>
<head>
    <title>Hub Ecolab - Alterar Senha</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; margin-top: 100px; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 300px; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; }
        button { width: 100%; padding: 10px; background-color: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; margin-bottom: 10px; }
        .btn-voltar { display: block; width: 93%; text-align: center; padding: 10px; background-color: #6c757d; color: white; text-decoration: none; border-radius: 4px; font-size: 0.9em;}
        .flash { color: red; font-size: 0.9em; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Alterar Senha</h2>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="flash">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form method="POST">
            <input type="password" name="senha_atual" placeholder="Senha Atual" required>
            <input type="password" name="nova_senha" placeholder="Nova Senha" required>
            <input type="password" name="confirmar_senha" placeholder="Confirmar Nova Senha" required>
            <button type="submit">Atualizar Senha</button>
        </form>
        <a href="{{ url_for('views.dashboard') }}" class="btn-voltar">Cancelar e Voltar</a>
    </div>
</body>
</html>
